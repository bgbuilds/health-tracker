<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Health Tracker</title>
<style>
  :root{
    --cream:#faf5ea;
    --card:#ffffff;
    --ink:#141414;
    --muted:#6b6257;
    --amber:#d97706;
    --amber-soft:#fef3e2;
    --amber-border:#f3d9a8;
    --track:#ece5d5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
  header.page{padding:8px 4px 0}
  header.page h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
  header.page .rule{height:4px;background:var(--amber);border-radius:2px;margin:10px 0 6px;max-width:120px}
  .updated{font-size:13px;color:var(--muted);margin:0 0 4px}
  .stale-note{
    display:none;margin:10px 0;padding:10px 12px;font-size:13px;
    background:#fff7e6;border:1px solid var(--amber-border);border-radius:10px;color:#7a4a00;
  }
  .stale-note.show{display:block}
  section.card{
    background:var(--card);border-radius:16px;padding:16px;margin:14px 0;
    box-shadow:0 1px 3px rgba(60,40,10,.07);
  }
  section.card h2{margin:0 0 12px;font-size:18px;font-weight:800;letter-spacing:-.2px}
  .toggle{display:flex;background:var(--track);border-radius:999px;padding:4px;margin-bottom:14px}
  .toggle button{
    flex:1;border:0;background:transparent;border-radius:999px;padding:9px 0;
    font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;
  }
  .toggle button.active{background:var(--ink);color:#fff}
  .stat-row{display:flex;gap:12px}
  .stat{flex:1;background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:12px;padding:12px}
  .stat .num{font-size:24px;font-weight:800}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
  .bar{height:12px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar > div{height:100%;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:999px}
  .protein-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
  .protein-line .big{font-size:22px;font-weight:800}
  .protein-line .small{font-size:13px;color:var(--muted)}
  .ring-wrap{display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:96px;height:96px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .ring .center .big{font-size:22px;font-weight:800}
  .ring .center .small{font-size:11px;color:var(--muted)}
  .meal{border-top:1px solid var(--track);padding:12px 0}
  .meal:first-of-type{border-top:0;padding-top:0}
  .meal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .meal-head .name{font-weight:800;font-size:16px}
  .meal-head .macros{font-size:13px;color:var(--muted);white-space:nowrap}
  .meal ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:#333}
  .meal li{margin:3px 0}
  .flags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .flag{font-size:12px;background:var(--amber-soft);border:1px solid var(--amber-border);color:#7a4a00;border-radius:999px;padding:3px 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:999px;padding:5px 12px}
  .nutri-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nutri{background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:12px;padding:10px 12px}
  .nutri .n{font-weight:800;font-size:14px}
  .nutri .p{font-size:16px;font-weight:800;color:var(--amber);margin:2px 0}
  .nutri .t{font-size:12px;color:var(--muted)}
  .caveat{font-size:12px;color:var(--muted);margin:10px 0 0;font-style:italic}
  .sleep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .sleep-grid .stat .num{font-size:20px}
  footer{margin-top:20px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Health Tracker</h1>
    <div class="rule"></div>
    <p class="updated" id="updated">Loading…</p>
    <div class="stale-note" id="stale-note">Couldn't reach the latest data — showing the last saved snapshot.</div>
  </header>

  <section class="card" id="summary">
    <div class="toggle" role="tablist">
      <button id="tab-day" class="active" type="button">Day</button>
      <button id="tab-week" type="button">Week</button>
    </div>
    <div id="panel-day"></div>
    <div id="panel-week" style="display:none"></div>
  </section>

  <section class="card" id="food">
    <h2>Food log</h2>
    <div id="meals"></div>
  </section>

  <section class="card" id="plants">
    <h2>Plant diversity</h2>
    <div id="plant-summary"></div>
    <div class="chips" id="plant-chips" style="margin-top:12px"></div>
  </section>

  <section class="card" id="activity">
    <h2>Activity</h2>
    <div class="stat-row" id="activity-stats"></div>
  </section>

  <section class="card" id="sleep">
    <h2>Sleep <span style="font-weight:400;font-size:13px;color:var(--muted)">· last night</span></h2>
    <div id="sleep-main"></div>
    <div class="sleep-grid" id="sleep-grid" style="margin-top:10px"></div>
  </section>

  <section class="card" id="nutrients">
    <h2>Key nutrients</h2>
    <div class="nutri-grid" id="nutri-grid"></div>
    <p class="caveat">Directional estimates based on logged foods — not precise measurements.</p>
  </section>

  <footer>Health Tracker · updates every 30 min</footer>
</div>

</script>
<script src="./app.js"></script>
</body>
</html>
